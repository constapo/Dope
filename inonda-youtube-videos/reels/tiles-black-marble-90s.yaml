    min_seconds: 4.2
  - speech: "First, we check the room and measure everything."    # measure
    greek: "Πρώτα ελέγχουμε τον χώρο και μετράμε τα πάντα."
    picture: {generate: "hands holding a yellow tape measure along an old tiled floor next to a wall"}
    move: {zoom_from: 1.06, zoom_to: 1.00}
    min_seconds: 4.2
  - speech: "We protect doors and furniture from dust."           # protect
    greek: "Προστατεύουμε πόρτες και έπιπλα από τη σκόνη."
    picture: {generate: "doorway and furniture covered with clear protective plastic sheeting and tape in an apartment"}
    move: {zoom_from: 1.03, zoom_to: 1.03, slide_x: 0.6}
    min_seconds: 4.2
  - speech: "Then we remove the old tiles cleanly."               # work1
    greek: "Μετά αφαιρούμε τα παλιά πλακάκια καθαρά."
