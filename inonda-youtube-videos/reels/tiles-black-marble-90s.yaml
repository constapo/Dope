slug: tiles-black-marble-90s
title: "New floor tiles, step by step"
format: reel
target_seconds: 90
lines:
  - speech: "Cracked, tired floor tiles?"                         # old1
    greek: "Σπασμένα, κουρασμένα πλακάκια δαπέδου;"
    label: "BEFORE · ΠΡΙΝ"
    picture: {generate: "close-up of cracked, stained beige 1990s ceramic floor tiles in a Cyprus apartment hallway"}
    move: {zoom_from: 1.00, zoom_to: 1.10}
    min_seconds: 4.2
  - speech: "Old floors trap dirt and look worn."                 # old2
    greek: "Τα παλιά δάπεδα κρατούν βρωμιά και δείχνουν φθαρμένα."
    label: "BEFORE · ΠΡΙΝ"
